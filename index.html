<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MathCompile</title>
    <script>
      // Set data-theme before first paint so a saved dark preference
      // doesn't flash light. App.svelte keeps this in sync afterward.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('mathcompile-theme') ||
          (matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light');
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
